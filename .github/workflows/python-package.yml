# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --python ${{ matrix.python-version }} --locked --group test --no-editable
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names in neutralocean/, tests/, examples/
        uv run --python ${{ matrix.python-version }} --no-sync flake8 neutralocean tests examples --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run --python ${{ matrix.python-version }} --no-sync flake8 neutralocean tests examples --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: uv run --python ${{ matrix.python-version }} --no-sync pytest
